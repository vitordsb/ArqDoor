name: Deploy (VPS)

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    # Skip automatically if required secrets are not configured.
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package dist
        run: tar -czf dist.tar.gz -C dist .

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist tarball
        run: scp -o BatchMode=yes dist.tar.gz "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/arqdoor-dist.tar.gz"

      - name: Extract on VPS
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail

          DEST='${{ secrets.VPS_FRONTEND_PATH }}'
          if [ -z "$DEST" ]; then
            DEST='/var/www/arqdoor'
          fi

          mkdir -p "$DEST"
          tar -xzf /tmp/arqdoor-dist.tar.gz -C "$DEST"
          chmod -R a+rX "$DEST"
          rm -f /tmp/arqdoor-dist.tar.gz

          if command -v nginx >/dev/null 2>&1; then
            nginx -t
            # Static deploy doesn't require reload, but it's cheap and safe if systemd is present.
            if command -v systemctl >/dev/null 2>&1; then
              systemctl reload nginx || true
            fi
          fi
          EOF

